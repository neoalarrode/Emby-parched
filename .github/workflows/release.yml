name: release

# Compila el parcheador (linux-x64 y linux-arm64) y publica emby-parched-linux.tar.gz como
# release, listo para ejecutar aplicar-parche.sh. Se lanza al subir una etiqueta v* o a mano
# (Actions -> release -> Run workflow), indicando la versión; en ese caso la etiqueta la crea la release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de la release (etiqueta), p. ej. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: ./build.sh

      - name: Empaquetar
        run: |
          mkdir -p dist/emby-parched
          cp -r aplicar-parche.sh README.md bin tools dist/emby-parched/
          tar -C dist -czf emby-parched-linux.tar.gz emby-parched
          tar -tzvf emby-parched-linux.tar.gz

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" emby-parched-linux.tar.gz \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Kit listo para usar: descomprimir y ejecutar \`sudo ./aplicar-parche.sh\`. Ver README."
